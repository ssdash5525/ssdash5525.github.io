<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>

    /* ── Filter tabs ───────────────────────────────────────── */
    .filter-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 2px;
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--ink-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover  { color: var(--ink); border-color: var(--ink-muted); }
    .filter-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

    /* ── Grid ──────────────────────────────────────────────── */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1.2rem;
    }
    .gallery-item {
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      border: 1px solid var(--rule);
      background: var(--paper-warm);
    }
    .gallery-item img {
      width: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease, opacity 0.35s ease;
    }
    .gallery-item:hover img {
      transform: scale(1.04);
      opacity: 0.88;
    }
    /* overlay on hover */
    .gallery-item .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(20,20,18,0.62) 0%, transparent 55%);
      opacity: 0;
      transition: opacity 0.25s ease;
      display: flex;
      align-items: flex-end;
      padding: 0.9rem 1rem;
    }
    .gallery-item:hover .overlay { opacity: 1; }
    .overlay-caption {
      font-family: var(--sans);
      font-size: 12.5px;
      color: #fff;
      line-height: 1.45;
    }
    .overlay-tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.18);
      border-radius: 2px;
      padding: 1px 6px;
      margin-bottom: 0.3rem;
    }

    /* hide filtered-out items */
    .gallery-item.hidden { display: none; }

    /* ── Lightbox ──────────────────────────────────────────── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(10,10,9,0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .lightbox.open { display: flex; }

    .lb-inner {
      position: relative;
      max-width: 880px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }
    .lb-img-wrap {
      position: relative;
      width: 100%;
      pointer-events: none;
    }
    .lb-img-wrap img { pointer-events: auto; }
    .lb-img-wrap img {
      width: 100%;
      max-height: 72vh;
      object-fit: contain;
      border-radius: 4px;
      display: block;
    }

    /* prev / next arrows */
    .lb-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      font-size: 1.2rem;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      user-select: none;
      z-index: 1001;
    }
    .lb-arrow:hover { background: rgba(255,255,255,0.22); }
    .lb-prev { left: 1.5rem; }
    .lb-next { right: 1.5rem; }

    /* caption row */
    .lb-caption {
      text-align: center;
      color: rgba(255,255,255,0.75);
      pointer-events: none;
    }
    .lb-caption-tag {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 0.3rem;
    }
    .lb-caption-text {
      font-family: var(--serif);
      font-size: 17px;
      font-style: italic;
      line-height: 1.5;
    }
    .lb-counter {
      font-family: var(--mono);
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      margin-top: 0.2rem;
    }

    /* close button */
    .lb-close {
      position: fixed;
      top: 1.4rem;
      right: 1.6rem;
      background: none;
      border: none;
      color: rgba(255,255,255,0.55);
      font-size: 1.6rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.15s;
    }
    .lb-close:hover { color: #fff; }

    /* empty state */
    .gallery-empty {
      font-family: var(--sans);
      font-size: 14px;
      color: var(--ink-muted);
      font-style: italic;
    }

    /* Tablet: tighter grid */
    @media (max-width: 768px) {
      .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.9rem; }
      .lightbox { padding: 1rem; }
    }

    @media (max-width: 600px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 0.7rem; }
      .filter-btn { font-size: 11px; padding: 5px 12px; }
      /* Move arrows inside the image area on small screens */
      .lb-prev { left: 0.5rem; }
      .lb-next { right: 0.5rem; }
      .lb-arrow { width: 36px; height: 36px; font-size: 1rem; background: rgba(0,0,0,0.5); }
      .lb-close { top: 0.8rem; right: 0.8rem; }
      .lb-inner { gap: 0.8rem; }
      .lb-caption-text { font-size: 15px; }
    }
  </style>
</head>
<body>

<nav></nav>

<div class="page">
  <p class="section-label">Gallery</p>

  <!-- Filter bar — built by JS -->
  <div class="filter-bar" id="js-filter-bar"></div>

  <!-- Grid -->
  <div class="gallery-grid" id="js-gallery"></div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="js-lightbox" role="dialog" aria-modal="true">
  <button class="lb-arrow lb-prev" id="js-lb-prev" aria-label="Previous">&#8592;</button>
  <button class="lb-arrow lb-next" id="js-lb-next" aria-label="Next">&#8594;</button>
  <button class="lb-close" id="js-lb-close" aria-label="Close">&#x2715;</button>
  <div class="lb-inner">
    <div class="lb-img-wrap">
      <img id="js-lb-img" src="" alt="">
    </div>
    <div class="lb-caption">
      <div class="lb-caption-tag" id="js-lb-tag"></div>
      <div class="lb-caption-text" id="js-lb-caption"></div>
      <div class="lb-counter" id="js-lb-counter"></div>
    </div>
  </div>
</div>

<footer></footer>

<script src="data.js"></script>
<script src="layout.js"></script>
<script>
  const gallery  = SITE.gallery || [];
  gallery.sort((a, b) => {
    // 1. Pinned items (no date) come first
    if (!a.date && !b.date) return 0;
    if (!a.date) return -1;
    if (!b.date) return 1;

    if (a.pinned && !b.pinned) return -1;
    if (!a.pinned && b.pinned) return 1;

    // 2. Sort by date (newest first)
    return new Date(b.date) - new Date(a.date);
  });
  
  const gridEl   = document.getElementById("js-gallery");
  const filterEl = document.getElementById("js-filter-bar");

  // ── Fixed category order — All goes last ────────────────
  const catOrder = ["Professional", "Personal", "Others"];
  const presentCats = new Set(gallery.map(g => g.category || "Others"));
  const orderedCats = [...catOrder.filter(c => presentCats.has(c)), "All"];

  // ── Build filter buttons (Professional active by default) ─
  filterEl.innerHTML = orderedCats.map((cat, i) => `
    <button class="filter-btn${i === 0 ? " active" : ""}"
            data-cat="${cat}">${cat}</button>
  `).join("");

  // ── Build grid ───────────────────────────────────────────
  if (!gallery.length) {
    gridEl.innerHTML = `<p class="gallery-empty">Photos coming soon.</p>`;
  } else {
    gridEl.innerHTML = gallery.map((g, idx) => `
      <div class="gallery-item${orderedCats[0] !== "All" && g.category !== orderedCats[0] ? " hidden" : ""}" data-index="${idx}" data-cat="${g.category || "Others"}">
        <img src="${g.src}" alt="${g.caption || ""}" loading="lazy" style="aspect-ratio: ${g.orientation === 'portrait' ? '3/4' : '4/3'}; object-position: ${g.focus || 'center center'}">
        <div class="overlay">
          <div class="overlay-caption">
            ${g.category ? `<div class="overlay-tag">${g.category}</div>` : ""}
            ${g.caption  ? `<div>${g.caption}</div>` : ""}
          </div>
        </div>
      </div>
    `).join("");
  }

  // ── Filter logic ─────────────────────────────────────────
  let activeCat = orderedCats[0]; // "Professional" by default

  filterEl.addEventListener("click", e => {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;
    activeCat = btn.dataset.cat;
    // toggle active button
    filterEl.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    // show/hide items
    gridEl.querySelectorAll(".gallery-item").forEach(item => {
      const match = activeCat === "All" || item.dataset.cat === activeCat;
      item.classList.toggle("hidden", !match);
    });
    // rebuild visible index for lightbox
    buildVisibleList();
  });

  // ── Lightbox ─────────────────────────────────────────────
  const lb        = document.getElementById("js-lightbox");
  const lbImg     = document.getElementById("js-lb-img");
  const lbTag     = document.getElementById("js-lb-tag");
  const lbCaption = document.getElementById("js-lb-caption");
  const lbCounter = document.getElementById("js-lb-counter");

  let visibleList = [];   // indices into gallery[] currently visible
  let lbPos       = 0;   // position within visibleList

  function buildVisibleList() {
    visibleList = [...gridEl.querySelectorAll(".gallery-item:not(.hidden)")]
      .map(el => parseInt(el.dataset.index));
  }
  buildVisibleList();

  function openLightbox(galleryIndex) {
    lbPos = visibleList.indexOf(galleryIndex);
    if (lbPos === -1) lbPos = 0;
    showSlide(lbPos);
    lb.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeLightbox() {
    lb.classList.remove("open");
    document.body.style.overflow = "";
  }

  function showSlide(pos) {
    lbPos = (pos + visibleList.length) % visibleList.length;
    const item = gallery[visibleList[lbPos]];
    lbImg.src          = item.src;
    lbImg.alt          = item.caption || "";
    lbTag.textContent  = item.category || "";
    lbCaption.textContent = item.caption || "";
    lbCounter.textContent = `${lbPos + 1} / ${visibleList.length}`;
  }

  // click on grid item
  gridEl.addEventListener("click", e => {
    const item = e.target.closest(".gallery-item");
    if (!item) return;
    openLightbox(parseInt(item.dataset.index));
  });

  document.getElementById("js-lb-close").addEventListener("click", closeLightbox);
  document.getElementById("js-lb-prev").addEventListener("click", () => showSlide(lbPos - 1));
  document.getElementById("js-lb-next").addEventListener("click", () => showSlide(lbPos + 1));

  // click outside image to close — close if click lands outside lb-inner
  lb.addEventListener("click", e => {
    if (!e.target.closest(".lb-inner")) closeLightbox();
  });

  // keyboard: arrow keys + Escape
  document.addEventListener("keydown", e => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "ArrowLeft")  showSlide(lbPos - 1);
    if (e.key === "ArrowRight") showSlide(lbPos + 1);
    if (e.key === "Escape")     closeLightbox();
  });
</script>
</body>
</html>
