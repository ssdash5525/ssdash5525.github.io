<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Hero-specific styles */
    #hero {
      padding-top: 6rem;
      padding-bottom: 4rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 3rem;
      align-items: start;
    }
    /* Avatar is first in DOM (for mobile float), but goes right on desktop */
    #hero .avatar  { order: 2; }
    #hero .hero-text { order: 1; }
    .hero-name {
      font-family: var(--serif);
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin-bottom: 0.6rem;
    }
    .hero-role {
      font-family: var(--sans);
      font-size: 13px;
      color: var(--ink-soft);
      letter-spacing: 0.02em;
      margin-bottom: 1.8rem;
    }
    .hero-tagline {
      font-size: 17px;
      color: var(--ink-soft);
      max-width: 520px;
      line-height: 1.8;
    }
    .hero-links {
      display: flex;
      gap: 0.75rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--paper-warm);
      border: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--serif);
      font-size: 2rem;
      color: var(--ink-muted);
      font-style: italic;
      flex-shrink: 0;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* Quick-info strip */
    .info-strip {
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      padding: 2.5rem 0;
      margin-bottom: 4rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }
    .info-block-label {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.4rem;
    }
    .info-block-value {
      font-size: 16px;
      color: var(--ink-soft);
    }

    /* Tablet: tighten spacing, 2-col info strip */
    @media (max-width: 768px) {
      #hero { padding-top: 4rem; padding-bottom: 3rem; gap: 2rem; }
      .info-strip { grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    }

    /* Mobile: float avatar right so text wraps naturally around it */
    @media (max-width: 600px) {
      #hero {
        display: block;
        padding-top: 2.5rem;
        padding-bottom: 2rem;
      }
      #hero .avatar {
        float: right;
        margin: 0.3rem 0 1rem 1.2rem;
        width: 76px;
        height: 76px;
        font-size: 1.4rem;
      }
      #hero::after { content: ""; display: table; clear: both; }
      .hero-name { font-size: clamp(1.7rem, 7vw, 2.2rem); }
      .hero-role { font-size: 12px; margin-bottom: 1rem; }
      .hero-tagline { font-size: 16px; max-width: 100%; }
      .hero-links { margin-top: 1.4rem; gap: 0.5rem; }
      .info-strip { grid-template-columns: 1fr; gap: 1.2rem; padding: 1.8rem 0; margin-bottom: 3rem; }
    }
  </style>
</head>
<body>

<nav></nav>

<div class="page">

  <!-- Hero -->
  <section id="hero">
    <div class="avatar" id="js-avatar"></div>
    <div class="hero-text">
      <h1 class="hero-name" id="js-name"></h1>
      <p class="hero-role" id="js-role"></p>
      <p class="hero-tagline" id="js-tagline"></p>
      <div class="hero-links" id="js-hero-links"></div>
    </div>
  </section>

  <!-- Quick info strip -->
  <div class="info-strip">
    <div>
      <div class="info-block-label">Affiliation</div>
      <div class="info-block-value" id="js-institute"></div>
    </div>
    <div>
      <div class="info-block-label">Research</div>
      <div class="info-block-value">Macromolecular crowding &amp; protein dynamics</div>
    </div>
    <div>
      <div class="info-block-label">Location</div>
      <div class="info-block-value" id="js-location"></div>
    </div>
  </div>

</div>

<footer></footer>

<script src="data.js"></script>
<script src="layout.js"></script>
<script>
  // Populate hero from SITE data
  document.getElementById("js-name").textContent     = SITE.name;
  document.getElementById("js-role").textContent     = `${SITE.role} · ${SITE.department} · ${SITE.institute}`;
  document.getElementById("js-tagline").textContent  = SITE.tagline;
  document.getElementById("js-institute").textContent = SITE.institute;
  document.getElementById("js-location").textContent  = SITE.location;

  // Avatar: photo or initials
  const av = document.getElementById("js-avatar");
  if (SITE.photo) {
    av.innerHTML = `<img src="${SITE.photo}" alt="${SITE.name}">`;
  } else {
    av.textContent = SITE.initials;
  }

  // Hero links
  const links = [
    { href: "research.html",     label: "Research",     cls: "btn-primary"   },
    { href: "publications.html", label: "Publications", cls: "btn-secondary" },
    { href: `mailto:${SITE.email}`,  label: "Email",   cls: "btn-secondary" },
    { href: SITE.github,         label: "GitHub",       cls: "btn-secondary" },
  ];
  document.getElementById("js-hero-links").innerHTML =
    links.map(l => `<a href="${l.href}" class="btn ${l.cls}">${l.label}</a>`).join("");
</script>
</body>
</html>
